# SOCIAL ATLAS — Source registry
#
# Every source here was probed from a development sandbox on 2026-10-25 with
# scripts/probe_source.py (HTTP status + robots.txt + structure). "probe" records
# what that check found. The pipeline keeps its own live status per source in
# data/db/source_state.json — that file, not this one, is the truth about whether a
# source is currently being monitored successfully.
#
# reliability: 1 = official organiser/venue/institution/tourism office
#              2 = official booking/ticketing page or organiser-run calendar (e.g. an organiser's Eventbrite page)
#              3 = reputable publication / newsletter
#              4 = search aggregator, social or community signal
# method (see pipeline/collectors):
#   jsonld_detail  listing page -> follow event links -> schema.org Event JSON-LD
#   jsonld_page    a single page that embeds schema.org Event JSON-LD
#   rss_events     RSS where each item is an event and pubDate is the start time
#   rss_news       RSS/Atom of articles -> "signals" (never auto-promoted to confirmed events)
#   bing_news      Bing News RSS search for a list of short queries -> signals
#   tribe_api      WordPress "The Events Calendar" REST API
#   paris_opendata Ville de Paris "Que faire à Paris" open data API
#   ical           iCalendar feed
#   manual         cannot be collected automatically (login wall, robots.txt, 403);
#                  kept for manual checking and URL submission
#
# Optional per source: frequency_days (default 1), max_items, keywords (signals must
# match at least one), city_keywords (for multi-city feeds), require_locality (venue text
# must name one of these places), booking_platform (listing page = ticket page), enabled.

defaults:
  frequency_days: 1
  max_items: 60

sources:
