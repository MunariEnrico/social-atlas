name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["data/db/**", "site/data/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest pipeline/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test site/tests/logic.test.js
