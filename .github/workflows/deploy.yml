name: Deploy site

# Publishes site/ (static app + pipeline JSON) to GitHub Pages.
# Called by the Collect and Submit workflows, and on any push that changes the site.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # pick up the data commit made earlier in the same workflow run
          ref: ${{ github.event.repository.default_branch || 'main' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
